<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justin Watkins</title>
<meta name="description" content="Justin Watkins — I build and ship working software. Virginia Beach, VA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --fg:#ffffff;
  --mute:#8a8a8a;
  --dim:#4a4a4a;
  --rule:#262626;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:"Courier Prime",ui-monospace,"Courier New",monospace;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

a{color:var(--fg);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:4px;}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px;}

.wrap{max-width:720px;margin:0 auto;padding:0 26px;}

/* ---------------- landing ---------------- */
.landing{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 26px 44px;
}

.boxmark{
  display:inline-block;
  background:var(--fg);
  color:var(--bg);
  font-weight:700;
  font-size:clamp(21px,6.2vw,34px);
  letter-spacing:-.01em;
  padding:5px 17px 7px;
  line-height:1.15;
}

.clock{
  color:var(--mute);
  font-size:15px;
  margin:16px 0 0;
  letter-spacing:.01em;
}

.landing nav{
  display:flex;
  flex-direction:column;
  gap:19px;
  margin:60px 0 0;
  font-size:17px;
}

.landing .social{
  margin:52px 0 0;
  color:var(--dim);
  font-size:14px;
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  justify-content:center;
}
.landing .social a{color:var(--dim);}
.landing .social a:hover{color:var(--fg);}

.landing .fine{
  margin:44px 0 0;
  color:var(--dim);
  font-size:13.5px;
}

/* ---------------- persistent bar ---------------- */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--rule);
  padding:9px 0;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s linear;
}
.bar.on{opacity:1;pointer-events:auto;}
@media (prefers-reduced-motion:reduce){.bar{transition:none;}}
.bar .wrap{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  max-width:960px;
  font-size:13.5px;
}
.bar .boxmark{font-size:14px;padding:2px 8px 3px;}
.bar a{color:var(--mute);}
.bar a:hover{color:var(--fg);}
.bar nav{display:flex;gap:14px;flex-wrap:wrap;}

/* ---------------- sections ---------------- */
section{
  padding:64px 0 12px;
  border-top:1px solid var(--rule);
  scroll-margin-top:52px;
}
section:first-of-type{border-top:none;}

h2{
  margin:0 0 8px;
  font-size:15px;
  font-weight:700;
}
.blurb{
  color:var(--mute);
  margin:0 0 34px;
  max-width:62ch;
}

p{max-width:64ch;margin:0 0 15px;}
p:last-child{margin-bottom:0;}

/* ---------------- entries ---------------- */
.item{
  padding:26px 0;
  border-top:1px solid var(--rule);
}
.item:first-of-type{border-top:none;padding-top:0;}

.item h3{
  margin:0;
  font-size:15px;
  font-weight:700;
}
.item .state{
  color:var(--mute);
  margin:0 0 15px;
  font-size:14px;
}
.item .stack{
  color:var(--dim);
  font-size:13.5px;
  margin:16px 0 0;
  max-width:64ch;
  line-height:1.65;
}

/* ---------------- about ---------------- */
.portrait{margin:0 0 26px;max-width:230px;}
.portrait img{width:100%;display:block;border:1px solid var(--rule);}
.portrait figcaption{color:var(--dim);font-size:13.5px;margin-top:8px;}

/* ---------------- lists ---------------- */
.group{margin:0 0 30px;}
.group:last-child{margin-bottom:0;}
.group h3{
  margin:0 0 9px;
  font-size:15px;
  font-weight:700;
  color:var(--mute);
}
.group ul{margin:0;padding:0;list-style:none;}
.group li{
  padding:3px 0;
  max-width:64ch;
}
.group li::before{
  content:"— ";
  color:var(--dim);
}

/* ---------------- background rows ---------------- */
.job{
  padding:19px 0;
  border-top:1px solid var(--rule);
}
.job:first-of-type{border-top:none;padding-top:0;}
.job .when{color:var(--dim);font-size:13.5px;margin:0 0 3px;}
.job .what{font-weight:700;margin:0;}
.job p.note{color:var(--mute);margin:5px 0 0;}

/* ---------------- contact ---------------- */
.lines{margin:0;padding:0;list-style:none;}
.lines li{padding:5px 0;}
.lines li span{color:var(--dim);display:inline-block;min-width:9.5em;}

footer{
  border-top:1px solid var(--rule);
  margin-top:64px;
  padding:22px 0 62px;
  color:var(--dim);
  font-size:13.5px;
  display:flex;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
footer a{color:var(--dim);}
footer a:hover{color:var(--fg);}

/* ---------------- responsive ---------------- */
@media (max-width:620px){
  body{font-size:14.5px;}
  .landing nav{font-size:16px;gap:17px;margin-top:48px;}
  .clock{font-size:13.5px;}
  section{padding-top:52px;}
  .lines li span{display:block;min-width:0;}
}
</style>
</head>
<body>

<div class="landing" id="top">
  <span class="boxmark">Justin Watkins</span>
  <p class="clock" id="clock">Virginia Beach, VA</p>

  <nav>
    <a href="projects.html">Projects</a>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="background.html">Background</a>
    <a href="contact.html">Contact</a>
  </nav>

  <p class="social">
    <a href="https://github.com/JustinW3">GitHub</a>
    <a href="mailto:justinwatkins114@gmail.com">Email</a>
  </p>

</div>

<script>
(function(){
  var clock = document.getElementById('clock');
  var months = ['01','02','03','04','05','06','07','08','09','10','11','12'];

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function tick(){
    var d = new Date();
    var h = d.getHours();
    var ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if (h === 0) h = 12;
    clock.textContent =
      months[d.getMonth()] + '/' + pad(d.getDate()) + '/' + d.getFullYear() +
      ' ' + h + ':' + pad(d.getMinutes()) + ampm + ' Virginia Beach';
  }

  tick();
  setInterval(tick, 10000);
})();
</script>

</body>
</html>
